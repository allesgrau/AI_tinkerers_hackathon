[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceguard"
version = "0.1.0"
description = "VoiceGuard verification package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "PyJWT>=2.8",
    "click>=8.1",
    "python-dotenv>=1.0",
    "twilio>=9.0",
    "numpy>=1.24",
    "speechbrain>=1.0",
    "torchaudio>=2.0",
    "torch>=2.0",
    "google-genai>=1.0",
]

[project.scripts]
voiceguard = "voiceguard.cli:main"

[tool.setuptools.packages.find]
include = ["voiceguard*"]
