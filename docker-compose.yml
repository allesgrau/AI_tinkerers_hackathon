version: "3.9"

services:
  voiceguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceguard
    ports:
      - "8000:8000"
    environment:
      - VOICEGUARD_CONFIG=/app/voiceguard.yml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./voiceguard.yml:/app/voiceguard.yml:ro
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    driver: local
