version: '3.9'

services:
  hospital-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-voice-agent
    ports:
      - "8000:8000"
    environment:
      # Load from .env file
      - DB_PATH=/app/hospital_agent.db
      - SMS_PROVIDER=${SMS_PROVIDER:-twilio}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PHONE_NUMBER=${VAPI_PHONE_NUMBER}
      - VOICE_SIMILARITY_THRESHOLD=${VOICE_SIMILARITY_THRESHOLD:-0.72}
      - AUDIO_BUFFER_DIR=/app/audio_buffer
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./hospital_agent.db:/app/hospital_agent.db
      - ./audio_buffer:/app/audio_buffer
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  hospital-network:
    driver: bridge

volumes:
  database:
    driver: local
  audio_buffer:
    driver: local
